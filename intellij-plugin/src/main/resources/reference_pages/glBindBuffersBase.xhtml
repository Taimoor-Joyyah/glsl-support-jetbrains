    <header/>
    <div class="refentry" id="glBindBuffersBase">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glBindBuffersBase — bind one or more buffer objects to a sequence of indexed buffer targets</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glBindBuffersBase</strong>(</code>
              </td>
              <td>GLenum <var class="pdparam">target</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">first</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLsizei <var class="pdparam">count</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>const GLuint *<var class="pdparam">buffers</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>target</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the target of the bind operation. <em class="parameter"><code>target</code></em> must be
                    one of <code class="constant">GL_ATOMIC_COUNTER_BUFFER</code>,
                    <code class="constant">GL_TRANSFORM_FEEDBACK_BUFFER</code>, <code class="constant">GL_UNIFORM_BUFFER</code> or
                    <code class="constant">GL_SHADER_STORAGE_BUFFER</code>.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>first</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the index of the first binding point within the array specified by <em class="parameter"><code>target</code></em>.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>count</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the number of contiguous binding points to which to bind buffers.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>buffers</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    A pointer to an array of names of buffer objects to bind to the targets on the specified binding point, or <code class="constant">NULL</code>.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glBindBuffersBase</code> binds a set of <em class="parameter"><code>count</code></em> buffer objects whose names
            are given in the array <em class="parameter"><code>buffers</code></em> to the <em class="parameter"><code>count</code></em> consecutive binding
            points starting from index <em class="parameter"><code>first</code></em> of the array of targets specified
            by <em class="parameter"><code>target</code></em>. If <em class="parameter"><code>buffers</code></em> is <code class="constant">NULL</code> then
            <code class="function">glBindBuffersBase</code> unbinds any buffers that are currently bound to the referenced binding points.
            Assuming no errors are generated, it is equivalent to the following
            pseudo-code, which calls <a class="citerefentry" href="glBindBufferBase.xhtml"><span class="citerefentry"><span class="refentrytitle">glBindBufferBase</span></span></a>,
            with the exception that the non-indexed <em class="parameter"><code>target</code></em> is not changed by <code class="function">glBindBuffersBase</code>:
        </p>
        <pre class="programlisting">    for (i = 0; i &lt; count; i++) {
        if (buffers != NULL) {
            glBindBufferBase(target, first + i, buffers[i]);
        } else {
            glBindBufferBase(target, first + i, 0);
        }
    }</pre>
        <p>
            Each entry in <em class="parameter"><code>buffers</code></em> will be checked individually and if found to be invalid, the state
            for that buffer binding index will not be changed and an error will be generated. However, the state for
            other buffer binding indices referenced by the command will still be updated.
        </p>
      </div>
      <div class="refsect1" id="notes">
        <h2>Notes</h2>
        <p>
            <code class="function">glBindBuffersBase</code> is available only if the GL version is 4.4 or higher.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_ENUM</code> is generated if <em class="parameter"><code>target</code></em> is not
            <code class="constant">GL_ATOMIC_COUNTER_BUFFER</code>,
            <code class="constant">GL_TRANSFORM_FEEDBACK_BUFFER</code>, <code class="constant">GL_UNIFORM_BUFFER</code> or
            <code class="constant">GL_SHADER_STORAGE_BUFFER</code>.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if <em class="parameter"><code>first</code></em> + <em class="parameter"><code>count</code></em> is greater
            than the number of target-specific indexed binding points.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if any value in <em class="parameter"><code>buffers</code></em> is not
            zero or the name of an existing buffer object.
        </p>
      </div>
