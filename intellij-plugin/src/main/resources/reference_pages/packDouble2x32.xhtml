    <div class="refentry" id="packDouble2x32">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>packDouble2x32 — create a double-precision value from a pair of unsigned integers</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">double <strong class="fsfunc">packDouble2x32</strong>(</code>
              </td>
              <td>uvec2 <var class="pdparam">v</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>v</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies a vector of two unsigned integers to be packed into a single double-precision result.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">packDouble2x32</code> packs the component of parameter <em class="parameter"><code>v</code></em> into a 64-bit
            value. If an IEEE-754 infinity or NaN is created, it will not signal and the resulting floating-point value
            is undefined. Otherwise, the bit-level representation of <em class="parameter"><code>v</code></em> is preserved. The first
            vector component (<code class="code">v[0]</code>) specifies the 32 least significant bits of the result; the second
            component (<code class="code">v[1]</code>) specifies the 32 most significant bits.
        </p>
      </div>
