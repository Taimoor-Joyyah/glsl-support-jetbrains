    <div class="refentry" id="unpackDouble2x32">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>unpackDouble2x32 — produce two unsigned integers containing the bit encoding of a double precision floating point value</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">uvec2 <strong class="fsfunc">unpackDouble2x32</strong>(</code>
              </td>
              <td>double <var class="pdparam">d</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>d</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies double precision value to break into a pair of unsigned integers.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">unpackDouble2x32</code> returns a two-component unsigned integer vector
            representation of <em class="parameter"><code>d</code></em>. The bit-level representation of <em class="parameter"><code>d</code></em> is
            preserved. The first component of the returned vector contains
            the 32 least significant bits of the double; the second
            component consists the 32 most significant bits.
        </p>
      </div>
