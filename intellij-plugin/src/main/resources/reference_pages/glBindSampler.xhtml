    <header/>
    <div class="refentry" id="glBindSampler">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glBindSampler — bind a named sampler to a texturing target</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glBindSampler</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">unit</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">sampler</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>unit</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the index of the texture unit to which the sampler is bound.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the name of a sampler.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glBindSampler</code> binds <em class="parameter"><code>sampler</code></em> to the texture unit at index <em class="parameter"><code>unit</code></em>.
            <em class="parameter"><code>sampler</code></em> must be zero or the name of a sampler object previously returned from a call to
            <a class="citerefentry" href="glGenSamplers.xhtml"><span class="citerefentry"><span class="refentrytitle">glGenSamplers</span></span></a>. <em class="parameter"><code>unit</code></em> must be less than the value
            of <code class="constant">GL_MAX_COMBINED_TEXTURE_IMAGE_UNITS</code>.
        </p>
        <p>
            When a sampler object is bound to a texture unit, its state supersedes that of
            the texture object bound to that texture unit. If the sampler name zero is bound to
            a texture unit, the currently bound texture's sampler state becomes active. A single
            sampler object may be bound to multiple texture units simultaneously.
        </p>
      </div>
      <div class="refsect1" id="notes">
        <h2>Notes</h2>
        <p>
            <code class="function">glBindSampler</code> is available only if the GL version is 3.3 or higher.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if <em class="parameter"><code>unit</code></em> is greater than or equal to the value of
            <code class="constant">GL_MAX_COMBINED_TEXTURE_IMAGE_UNITS</code>.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if <em class="parameter"><code>sampler</code></em> is not zero or a name previously
            returned from a call to <a class="citerefentry" href="glGenSamplers.xhtml"><span class="citerefentry"><span class="refentrytitle">glGenSamplers</span></span></a>, or if such a name has
            been deleted by a call to <a class="citerefentry" href="glDeleteSamplers.xhtml"><span class="citerefentry"><span class="refentrytitle">glDeleteSamplers</span></span></a>.
        </p>
      </div>
      <div class="refsect1" id="associatedgets">
        <h2>Associated Gets</h2>
        <p>
            <a class="citerefentry" href="glGet.xhtml"><span class="citerefentry"><span class="refentrytitle">glGet</span></span></a> with argument <code class="constant">GL_SAMPLER_BINDING</code>
