    <header/>
    <div class="refentry" id="glBindTextureUnit">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glBindTextureUnit — bind an existing texture object to the specified texture unit </p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glBindTextureUnit</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">unit</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">texture</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
          <em class="parameter"><code>unit</code></em>
        </span>
            </dt>
            <dd>
              <p>
Specifies the texture unit, to which the texture object should be bound to.
                    </p>
            </dd>
            <dt>
              <span class="term">
          <em class="parameter"><code>texture</code></em>
        </span>
            </dt>
            <dd>
              <p>
Specifies the name of a texture.                    </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p><code class="function">glBindTextureUnit</code> binds an existing texture object to the texture unit numbered <em class="parameter"><code>unit</code></em>.</p>
        <p><em class="parameter"><code>texture</code></em> must be zero or the name of an existing texture object. When <em class="parameter"><code>texture</code></em> is the name of an existing texture object, that object is bound to the target, in the corresponding texture unit, that was specified when the object was created. When <em class="parameter"><code>texture</code></em> is zero, each of the targets enumerated at the beginning of this section is reset to its default texture for the corresponding texture image unit.       </p>
      </div>
      <div class="refsect1" id="associatedgets">
        <h2>Associated Gets</h2>
        <p>
        <a class="citerefentry" href="glGet.xhtml"><span class="citerefentry"><span class="refentrytitle">glGet</span></span></a>
        with argument <code class="constant">GL_TEXTURE_BINDING_1D</code>,
        <code class="constant">GL_TEXTURE_BINDING_2D</code>,
        <code class="constant">GL_TEXTURE_BINDING_3D</code>,
        <code class="constant">GL_TEXTURE_BINDING_1D_ARRAY</code>,
        <code class="constant">GL_TEXTURE_BINDING_2D_ARRAY</code>,
        <code class="constant">GL_TEXTURE_BINDING_RECTANGLE</code>,
        <code class="constant">GL_TEXTURE_BINDING_BUFFER</code>,
        <code class="constant">GL_TEXTURE_BINDING_CUBE_MAP</code>,
        <code class="constant">GL_TEXTURE_BINDING_CUBE_MAP_ARRAY</code>,
        <code class="constant">GL_TEXTURE_BINDING_2D_MULTISAMPLE</code> or
        <code class="constant">GL_TEXTURE_BINDING_2D_MULTISAMPLE_ARRAY</code>.
    </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p><code class="constant">GL_INVALID_OPERATION</code> error is generated if <em class="parameter"><code>texture</code></em> is not zero or the name of an existing texture object.
        </p>
      </div>
