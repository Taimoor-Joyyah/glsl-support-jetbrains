      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the sampler to which the texture from which texels will be retrieved is bound.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the texture coordinates at which texture will be sampled.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>lod</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    If present, specifies the level-of-detail within the texture from which the texel will be fetched.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sample</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    For multisampled fetches, specifies which sample within the texel from which will be returned.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">texelFetch</code> performs a lookup of a single texel from texture coordinate <em class="parameter"><code>P</code></em>
            in the texture bound to <em class="parameter"><code>sampler</code></em>. The array layer is specified in the last component of
            <em class="parameter"><code>P</code></em> for array forms. The <em class="parameter"><code>lod</code></em> parameter (if present) specifies the level-of-detail
            from which the texel will be fetched. The <em class="parameter"><code>sample</code></em> specifies which sample within the texel will be
            returned when reading from a multi-sample texure.
        </p>
      </div>
