        <h2>Name</h2>
        <p>frexp — split a floating point number</p>
      </div>

      <div class="refsect1" id="parameters">

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">frexp</code> extracts <em class="parameter"><code>x</code></em> into a floating-point significand
            in the range [0.5, 1.0) and in integral exponent of two, such that:
        </p>
        <p>
            <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll">
                <mml:mi>x</mml:mi>
                <mml:mo>=</mml:mo>
                <mml:mi>significand</mml:mi>
                <mml:mo lspace="2px" rspace="2px">⋅</mml:mo>
                <mml:msup>
                <mml:mn>2</mml:mn>
                <mml:mi>exponent</mml:mi>
                </mml:msup>
            </mml:math>
        </p>
        <p>
            The significand is returned by the function and the exponent is returned in the output
            parameter <em class="parameter"><code>exp</code></em>. For a floating-point value of zero, the
            significand and exponent are both zero. For a floating-point value that is an
            infinity or a floating-point NaN, the results are undefined.
        </p>
      </div>
