    <div class="refentry" id="groupMemoryBarrier">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>groupMemoryBarrier — controls the ordering of memory transaction issued shader invocation relative to a work group</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">groupMemoryBarrier</strong>(</code>
              </td>
              <td>void<code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">groupMemoryBarrier</code> waits on the completion of all memory accesses performed
            by an invocation of a compute shader relative to the same access performed by other invocations
            in the same work group and then returns with no other effect.
        </p>
