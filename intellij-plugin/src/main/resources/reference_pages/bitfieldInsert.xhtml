        <h2>Name</h2>
        <p>bitfieldInsert — insert a range of bits into an integer</p>
      </div>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">bitfieldInsert</code> inserts the <em class="parameter"><code>bits</code></em> least significant bits of <em class="parameter"><code>insert</code></em>
            into <em class="parameter"><code>base</code></em> at offset <em class="parameter"><code>offset</code></em>. The returned value will have bits
            [<em class="parameter"><code>offset</code></em>, <em class="parameter"><code>offset</code></em> + <em class="parameter"><code>bits</code></em> + 1] taken from [0, <em class="parameter"><code>bits</code></em> - 1]
            of <em class="parameter"><code>insert</code></em> and all other bits taken directly from the corresponding bits of <em class="parameter"><code>base</code></em>. If
            <em class="parameter"><code>bits</code></em> is zero, the result will simply be the original value of <em class="parameter"><code>base</code></em>. The result will
            be undefined if <em class="parameter"><code>offset</code></em> or <em class="parameter"><code>bits</code></em> is negative, or if the sum of <em class="parameter"><code>offset</code></em>
            and <em class="parameter"><code>bits</code></em> is greater than the number of bits used to store the operand.
        </p>
      </div>
