    <header/>
    <div class="refentry" id="glVertexArrayElementBuffer">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glVertexArrayElementBuffer — configures element array buffer binding of a vertex array object</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glVertexArrayElementBuffer</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">vaobj</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">buffer</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>vaobj</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Specifies the name of the vertex array object.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>buffer</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Specifies the name of the buffer object to use for the element array buffer binding.
                    </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glVertexArrayElementBuffer</code> binds a buffer object with id <em class="parameter"><code>buffer</code></em>
            to the element array buffer bind point of a vertex array object with id <em class="parameter"><code>vaobj</code></em>.
            If <em class="parameter"><code>buffer</code></em> is zero, any existing element array buffer binding to <em class="parameter"><code>vaobj</code></em>
            is removed.
        </p>
      </div>
      <div class="refsect1" id="associatedgets">
        <h2>Associated Gets</h2>
        <p>
        <a class="citerefentry" href="glGet.xhtml"><span class="citerefentry"><span class="refentrytitle">glGet</span></span></a>
        with argument <code class="constant">GL_ELEMENT_ARRAY_BUFFER_BINDING</code>.
    </p>
        <p>
        <a class="citerefentry" href="glGetVertexArrayiv.xhtml"><span class="citerefentry"><span class="refentrytitle">glGetVertexArrayiv</span></span></a>
        with argument <code class="constant">GL_ELEMENT_ARRAY_BUFFER_BINDING</code>.
    </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> error is generated if <em class="parameter"><code>vaobj</code></em> is not the name
            of an existing vertex array object.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> error is generated if <em class="parameter"><code>buffer</code></em> is not zero or
            the name of an existing buffer object.
        </p>
      </div>

        </p>
