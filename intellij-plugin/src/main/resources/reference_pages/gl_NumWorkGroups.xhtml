    <header/>
    <div class="refentry" id="gl_NumWorkGroups">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_NumWorkGroups — contains the number of workgroups that have been dispatched to a compute shader</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">uvec3 </span><span class="varname">gl_NumWorkGroups </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            In the compute language, <code class="varname">gl_NumWorkGroups</code>
            contains the total number of work groups that will execute the compute
            shader. The components of <code class="varname">gl_NumWorkGroups</code> are equal to the <em class="parameter"><code>num_groups_x</code></em>,
            <em class="parameter"><code>num_groups_y</code></em>, and <em class="parameter"><code>num_groups_z</code></em> parameters passed to the
            <code class="varname">glDispatchCompute</code> command.
        </p>
      </div>
