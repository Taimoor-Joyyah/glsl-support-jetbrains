<body><h1>gl_BaseInstance</h1>
<p>GLSL 4.60 vertex input</p>
<pre>in int gl_BaseInstance;</pre>
<p>Base instance of the drawing command. gl_InstanceID starts at zero within each draw.</p>
<pre>int instanceIndex = gl_BaseInstance + gl_InstanceID;</pre>
<p><a href="OpenGL46.xhtml">OpenGL46</a></p>
