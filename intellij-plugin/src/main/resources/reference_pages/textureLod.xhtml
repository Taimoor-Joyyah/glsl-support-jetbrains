      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the sampler to which the texture from which texels will be retrieved is bound.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the texture coordinates at which texture will be sampled.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>lod</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the explicit level-of-detail
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">textureLod</code> performs a texture lookup at coordinate <em class="parameter"><code>P</code></em> from the
            texture bound to <em class="parameter"><code>sampler</code></em> with an explicit level-of-detail as specified in <em class="parameter"><code>lod</code></em>.
            <em class="parameter"><code>lod</code></em> specifies
            <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll"><mml:msub><mml:mi>λ</mml:mi><mml:mi>base</mml:mi></mml:msub></mml:math>
            and sets the partial derivatives as follows:
        </p>
        <p>
            <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll">
                <mml:mtable rowalign="center">
                  <mml:mtr>
                    <mml:mtd>
                      <mml:mrow>
                        <mml:mfrac>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>u</mml:mi>
                          </mml:mrow>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>x</mml:mi>
                          </mml:mrow>
                        </mml:mfrac>
                        <mml:mo>=</mml:mo>
                        <mml:mn>0</mml:mn>
                        <mml:mo>,</mml:mo>
                      </mml:mrow>
                    </mml:mtd>
                    <mml:mtd>
                      <mml:mrow>
                        <mml:mfrac>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>v</mml:mi>
                          </mml:mrow>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>x</mml:mi>
                          </mml:mrow>
                        </mml:mfrac>
                        <mml:mo>=</mml:mo>
                        <mml:mn>0</mml:mn>
                        <mml:mo>,</mml:mo>
                      </mml:mrow>
                    </mml:mtd>
                    <mml:mtd>
                      <mml:mrow>
                        <mml:mfrac>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>w</mml:mi>
                          </mml:mrow>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>x</mml:mi>
                          </mml:mrow>
                        </mml:mfrac>
                        <mml:mo>=</mml:mo>
                        <mml:mn>0</mml:mn>
                      </mml:mrow>
                    </mml:mtd>
                  </mml:mtr>
                  <mml:mtr>
                    <mml:mtd>
                      <mml:mrow>
                        <mml:mfrac>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>u</mml:mi>
                          </mml:mrow>
                          <mml:mrow>
                            <mml:mi>δ</mml:mi>
                            <mml:mi>y</mml:mi>
                          </mml:mrow>
                        </mml:mfrac>
                        <mml:mo>=</mml:mo>
                        <mml:mn>0</mml:mn>
                        <mml:mo>,</mml:mo>
                      </mml:mrow>
                    </mml:mtd>
                    <mml:mtd>
                      <mml:mrow>
                        <mml:mfrac>
