      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>fwidth — return the sum of the absolute value of derivatives in x and y</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">

          </table>

      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>p</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the expression of which to take the partial
                    derivative.
                </p>
            </dd>

      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <span class="emphasis"><em>Available only in the fragment shader</em></span>,
            these functions return the sum of the absolute derivatives in
            $x$ and $y$ using local differencing for the input argument
            <em class="parameter"><code>p</code></em>.
            <code class="function">fwidth</code> is equivalent to
            <code class="code">
                <code class="function">abs</code>(<em class="parameter"><code>dFdx</code></em>(p)) +
                <code class="function">abs</code>(<em class="parameter"><code>dFdy</code></em>(p))
            </code>.
            <code class="function">fwidthCoarse</code> is equivalent to
            <code class="code">
                <code class="function">abs</code>(<em class="parameter"><code>dFdxCoarse</code></em>(p)) +
                <code class="function">abs</code>(<em class="parameter"><code>dFdyCoarse</code></em>(p))
            </code>.
            <code class="function">fwidthFine</code> is equivalent to
            <code class="code">
                <code class="function">abs</code>(<em class="parameter"><code>dFdxFine</code></em>(p)) +
                <code class="function">abs</code>(<em class="parameter"><code>dFdyFine</code></em>(p))
            </code>.
        </p>
      </div>
