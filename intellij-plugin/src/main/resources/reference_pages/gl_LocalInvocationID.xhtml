    <div class="refentry" id="gl_LocalInvocationID">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_LocalInvocationID — contains the index of work item currently being operated on by a compute shader</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">uvec3 </span><span class="varname">gl_LocalInvocationID </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            In the compute language, <code class="varname">gl_LocalInvocationID</code>
            is an input variable containing the n-dimensional index of the local
            work invocation within the work group that the current shader is
            executing in. The possible values for this variable range across
            the local work group size, i.e., (0,0,0) to (<code class="varname">gl_WorkGroupSize.x</code> - 1,
            <code class="varname">gl_WorkGroupSize.y</code> - 1, <code class="varname">gl_WorkGroupSize.z</code> - 1).
        </p>
      </div>
