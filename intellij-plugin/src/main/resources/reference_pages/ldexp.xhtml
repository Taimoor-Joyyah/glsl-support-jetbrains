      <div class="refnamediv">
        <h2>Name</h2>
        <p>ldexp — assemble a floating point number from a value and exponent</p>
      </div>
      <div class="refsynopsisdiv">

      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">ldexp</code> builds a floating point number from <em class="parameter"><code>x</code></em> and
            the corresponding integral exponent of two in <em class="parameter"><code>exp</code></em>, returning:
        </p>
        <p>
            <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll">
                <mml:mi>significand</mml:mi>
                <mml:mo lspace="2px" rspace="2px">⋅</mml:mo>
                <mml:msup>
                    <mml:mn>2</mml:mn>
                    <mml:mi>exponent</mml:mi>
                </mml:msup>
            </mml:math>
        </p>
        <p>
            If this product is too large to be represented in the floating point type, the result
            is undefined.
        </p>
      </div>
