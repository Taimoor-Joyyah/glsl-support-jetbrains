        <h2>Name</h2>
        <p>atan — return the arc-tangent of the parameters</p>
      </div>

      <div class="refsect1" id="parameters">

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">atan</code> returns either the angle whose
            trigonometric arctangent is $y \over x$ or
            <em class="parameter"><code>y_over_x</code></em>, depending on which overload is
            invoked. In the first overload, the signs of $y$ and $x$ are
            used to determine the quadrant that the angle lies in. The value
            returned by <code class="function">atan</code> in this case is in the
            range $[-\pi,\pi]$. The result is undefined if $x = 0$.
        </p>
        <p>
            For the second overload, <code class="function">atan</code> returns the
            angle whose tangent is <em class="parameter"><code>y_over_x</code></em>. The
            value returned in this case is in the range
            $[-{\pi \over 2 },{\pi \over 2}]$.
        </p>
      </div>
