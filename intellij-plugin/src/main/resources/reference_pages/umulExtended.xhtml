      <div class="refnamediv">
        <h2>Name</h2>
        <p>umulExtended — perform a 32- by 32-bit multiply to produce a 64-bit result</p>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">umulExtended</code> and <code class="function">imulExtended</code> perform multiplication of the two 32-bit integer
            quantities <em class="parameter"><code>x</code></em> and <em class="parameter"><code>y</code></em>, producing a 64-bit integer result. The 32 least
            significant bits of this product are returned in <em class="parameter"><code>lsb</code></em> and the 32 most significant bits are returned
            in <em class="parameter"><code>msb</code></em>. <code class="function">umulExtended</code> and <code class="function">imulExtended</code> perform
            unsigned and signed multiplication, respectively.
        </p>
