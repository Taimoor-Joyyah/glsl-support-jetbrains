      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>image</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the image unit from which to load a texel.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the coordinate from which to load the texel.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sample</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    When present, specifies the sample within the image to load
                </p>
            </dd>
          </dl>
        </div>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">imageLoad</code> loads the texel at the coordinate <em class="parameter"><code>P</code></em> from the image
            unit <em class="parameter"><code>image</code></em>.  For multi-sample loads, the sample number is given by <em class="parameter"><code>sample</code></em>.  When
            <em class="parameter"><code>image</code></em>, <em class="parameter"><code>P</code></em>, <em class="parameter"><code>sample</code></em> identify a valid texel, the bits used
            to represent the selected texel in memory are converted to a vec4, ivec4, or uvec4 in the manner described in the OpenGL
            Specification and returned.
        </p>
      </div>
