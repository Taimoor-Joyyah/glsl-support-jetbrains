    <header/>
    <div class="refentry" id="glCreateTextures">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glCreateTextures — create texture objects</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glCreateTextures</strong>(</code>
              </td>
              <td>GLenum <var class="pdparam">target</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLsizei <var class="pdparam">n</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint *<var class="pdparam">textures</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>target</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Specifies the effective texture target
                        of each created texture.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>n</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Number of texture objects to create.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>textures</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Specifies an array in which names of the new texture
                        objects are stored.
                    </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glCreateTextures</code>
            returns <em class="parameter"><code>n</code></em> previously unused texture names
            in <em class="parameter"><code>textures</code></em>, each representing a new
            texture object of the dimensionality and type specified by
            <em class="parameter"><code>target</code></em> and initialized to the default values
            for that texture type.
        </p>
        <p>
            <em class="parameter"><code>target</code></em> must be one of
            <code class="constant">GL_TEXTURE_1D</code>,
            <code class="constant">GL_TEXTURE_2D</code>,
            <code class="constant">GL_TEXTURE_3D</code>,
            <code class="constant">GL_TEXTURE_1D_ARRAY</code>,
            <code class="constant">GL_TEXTURE_2D_ARRAY</code>,
            <code class="constant">GL_TEXTURE_RECTANGLE</code>,
            <code class="constant">GL_TEXTURE_CUBE_MAP</code>,
            <code class="constant">GL_TEXTURE_CUBE_MAP_ARRAY</code>,
            <code class="constant">GL_TEXTURE_BUFFER</code>,
            <code class="constant">GL_TEXTURE_2D_MULTISAMPLE</code> or
            <code class="constant">GL_TEXTURE_2D_MULTISAMPLE_ARRAY</code>.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_ENUM</code> is generated if
            <em class="parameter"><code>target</code></em> is not one of the allowable
            values.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if
            <em class="parameter"><code>n</code></em> is negative.
        </p>
      </div>
