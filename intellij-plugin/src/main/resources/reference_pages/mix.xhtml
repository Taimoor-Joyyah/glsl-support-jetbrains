      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">mix</code> performs a linear interpolation between
            <em class="parameter"><code>x</code></em> and <em class="parameter"><code>y</code></em> using
            <em class="parameter"><code>a</code></em> to weight between them. The return
            value is computed as $x \times (1 - a) + y \times a$.
        </p>
        <p>
            The variants of <code class="function">mix</code> where
            <em class="parameter"><code>a</code></em> is <code class="constant">genBType</code> select
            which vector each returned component comes from. For a component
            of <em class="parameter"><code>a</code></em> that is false, the corresponding
            component of <em class="parameter"><code>x</code></em> is returned. For a
            component of <em class="parameter"><code>a</code></em> that is true, the
            corresponding component of <em class="parameter"><code>y</code></em> is returned.
            Components of <em class="parameter"><code>x</code></em> and
            <em class="parameter"><code>y</code></em> that are not selected are allowed to be
            invalid floating-point values and will have no effect on the
            results.
        </p>
      </div>
