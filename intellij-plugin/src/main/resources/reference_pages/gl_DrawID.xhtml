<body><h1>gl_DrawID</h1>
<p>GLSL 4.60 vertex input</p>
<pre>in int gl_DrawID;</pre>
<p>Zero-based draw index within a multi-draw command. A single draw receives zero. The value is dynamically uniform within a draw.</p>
<pre>int materialIndex = gl_DrawID;</pre>
<p><a href="OpenGL46.xhtml">OpenGL46</a></p>
<p>GLSL Support supplement based on the <a href="specs/GLSLangSpec.4.60.pdf">Khronos GLSL 4.60 specification</a></p>
