    <div class="refentry" id="intBitsToFloat">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>intBitsToFloat, uintBitsToFloat — produce a floating point using an encoding supplied as an integer</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">genType <strong class="fsfunc">intBitsToFloat</strong>(</code>
              </td>
              <td>genIType <var class="pdparam">x</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">genType <strong class="fsfunc">uintBitsToFloat</strong>(</code>
              </td>
              <td>genUType <var class="pdparam">x</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>x</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the bit encoding to return as a floating point value.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">intBitsToFloat</code> and <code class="function">uintBitsToFloat</code> return the encoding
            passed in parameter <em class="parameter"><code>x</code></em> as a floating-point value. If the encoding of
            a NaN is passed in <em class="parameter"><code>x</code></em>, it will not signal and the resulting value will
            be undefined. If the encoding of a floating point infinity is passed in parameter <em class="parameter"><code>x</code></em>,
            the resulting floating-point value is the corresponding (positive or negative) floating
            point infinity.
        </p>
      </div>
