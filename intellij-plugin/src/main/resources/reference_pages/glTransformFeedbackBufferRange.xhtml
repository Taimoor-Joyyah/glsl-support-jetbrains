    <div class="refentry" id="glTransformFeedbackBufferRange">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glTransformFeedbackBufferRange — bind a range within a buffer object to a transform feedback buffer object</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glTransformFeedbackBufferRange</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">xfb</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">index</var>, </td>
            </tr>
            <tr>
              <td> </td>

            </tr>

          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>xfb</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Name of the transform feedback buffer object.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>index</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Index of the binding point within
                        <em class="parameter"><code>xfb</code></em>.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>buffer</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Name of the buffer object to bind to the specified
                        binding point.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>offset</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        The starting offset in basic machine units into the
                        buffer object.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>size</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        The amount of data in basic machine units that can
                        be read from or written to the buffer object while
                        used as an indexed target.
                    </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glTransformFeedbackBufferRange</code>
            binds a range of the buffer object <em class="parameter"><code>buffer</code></em>
            represented by <em class="parameter"><code>offset</code></em> and
            <em class="parameter"><code>size</code></em> to the binding point at index
            <em class="parameter"><code>index</code></em> of the transform feedback object
            <em class="parameter"><code>xfb</code></em>.
        </p>
        <p>
            <em class="parameter"><code>offset</code></em> specifies the offset in basic
            machine units into the buffer object
            <em class="parameter"><code>buffer</code></em> and <em class="parameter"><code>size</code></em>
            specifies the amount of data that can be read from the buffer
            object while used as an indexed target.
        </p>
      </div>
      <div class="refsect1" id="notes">
        <h2>Notes</h2>
        <p>
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if
            <em class="parameter"><code>xfb</code></em> is not the name of an existing
            transform feedback object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if in
            <em class="parameter"><code>buffer</code></em> is not zero or the name of an
            existing buffer object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if
            <em class="parameter"><code>index</code></em> is greater than or equal to the
            number of transform feedback buffer binding points (the value of
            <code class="constant">GL_TRANSFORM_FEEDBACK_BUFFER_BINDING</code>).
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if
            <em class="parameter"><code>offset</code></em> is negative.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if
            <em class="parameter"><code>buffer</code></em> is non-zero and either
            <em class="parameter"><code>size</code></em> is less than or equal to zero, or
            <em class="parameter"><code>offset</code></em> + <em class="parameter"><code>size</code></em> is
            greater than the value of <code class="constant">GL_BUFFER_SIZE</code>
            for <em class="parameter"><code>buffer</code></em>.
        </p>
      </div>
