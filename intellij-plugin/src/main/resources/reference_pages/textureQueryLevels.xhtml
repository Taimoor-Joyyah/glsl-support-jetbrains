      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the sampler to which the texture whose mipmap level count will be queried is bound.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">textureQueryLevels</code> returns the number of accessible mipmap levels
            in the texture associated with <em class="parameter"><code>sampler</code></em>.
        </p>
        <p>
            If called on an incomplete texture, or if no texture is associated with <em class="parameter"><code>sampler</code></em>, zero is returned.
        </p>
      </div>
