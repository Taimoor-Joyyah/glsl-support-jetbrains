      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">

              <span class="term">
                <em class="parameter">
                  <code>interpolant</code>

              <p>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">interpolateAtCentroid</code> returns the value of the input varying <em class="parameter"><code>interpolant</code></em>
            sampled at a location inside both the pixel and the primitive being processed. The value obtained would be the value
            assigned to the input variable if declared with the <code class="code">centroid</code> qualifier.
        </p>
