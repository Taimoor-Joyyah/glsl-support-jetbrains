    <div class="refentry" id="findMSB">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>findMSB — find the index of the most significant bit set to 1 in an integer</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">genIType <strong class="fsfunc">findMSB</strong>(</code>
              </td>
              <td>genIType <var class="pdparam">value</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">genIType <strong class="fsfunc">findMSB</strong>(</code>
              </td>
              <td>genUType <var class="pdparam">value</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>value</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the value whose bits to scan.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">findMSB</code> returns the bit number of the most significant bit that is set to 1 in the binary
            representation of <em class="parameter"><code>value</code></em>. For positive integers, the result will be the bit number
            of the most significant bit that is set to 1. For negative integers, the result will be the bit number of the
            most significant bit set to 0. For a <em class="parameter"><code>value</code></em> of zero or negative 1, -1 will be returned.
        </p>
      </div>
