    <header/>
    <div class="refentry" id="all">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>all — check whether all elements of a boolean vector are true</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">bool <strong class="fsfunc">all</strong>(</code>
              </td>
              <td>bvec <var class="pdparam">x</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>x</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the vector to be tested for truth.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">all</code> returns true if all elements of <em class="parameter"><code>x</code></em> are true and false otherwise.
            It is functionally equivalent to:
        </p>
        <p>
        </p>
        <pre class="programlisting">    bool all(bvec x)       // bvec can be bvec2, bvec3 or bvec4
    {
        bool result = true;
        int i;
        for (i = 0; i &lt; x.length(); ++i)
        {
            result &amp;= x[i];
        }
        return result;
    }</pre>
        <p>
        </p>
      </div>
