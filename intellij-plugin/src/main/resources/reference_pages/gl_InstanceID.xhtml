    <div class="refentry" id="gl_InstanceID">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_InstanceID — contains the index of the current primitive in an instanced draw command</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">int </span><span class="varname">gl_InstanceID </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="varname">gl_InstanceID</code> is a vertex language input variable that
            holds the integer index of the current primitive in an instanced draw
            command such as <code class="varname">glDrawArraysInstanced</code>. If the current
            primitive does not originate from an instanced draw command, the value
            of <code class="varname">gl_InstanceID</code> is zero.
        </p>
      </div>
