    <div class="refentry" id="EndPrimitive">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>EndPrimitive — complete the current output primitive on the first vertex stream</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">EndPrimitive</strong>(</code>
              </td>
              <td>void<code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <span class="emphasis"><em>Available only in the Geometry Shader</em></span>, <code class="function">EndPrimitive</code> completes the
            current output primitive on the first (and possibly only) vertex stream and starts a new one.No vertex is emitted.
            Calling <code class="function">EndPrimitive</code> is equivalent to calling <a class="citerefentry" href="EmitStreamVertex.xhtml"><span class="citerefentry"><span class="refentrytitle">EmitStreamVertex</span></span></a>
            with <em class="parameter"><code>stream</code></em> set to 0.
        </p>
      </div>
