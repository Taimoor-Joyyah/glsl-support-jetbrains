      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the sampler to which the texture from which texels will be retrieved is bound.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the texture coordinates at which texture will be sampled.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>dPdx</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the partial derivative of <em class="parameter"><code>P</code></em> with respect to window x.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>dPdy</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the partial derivative of <em class="parameter"><code>P</code></em> with respect to window y.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>offset</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the offsets, in texels at which the texture will be sampled relative to the projection of <em class="parameter"><code>P</code></em>.
                </p>
            </dd>
          </dl>
        </div>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">textureProjGradOffset</code> performs a texture lookup with projection and explicit gradients and offsets. The texture coordinates
            consumed from <em class="parameter"><code>P</code></em>, not including the last component of <em class="parameter"><code>P</code></em>,
            are divided by the last component of <em class="parameter"><code>P</code></em>. The resulting <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll"><mml:msup><mml:mn>3</mml:mn><mml:mi>rd</mml:mi></mml:msup></mml:math>
            component of <em class="parameter"><code>P</code></em> in the shadow forms is used as
            <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML" overflow="scroll"><mml:msub><mml:mi>D</mml:mi><mml:mi>ref</mml:mi></mml:msub></mml:math>.
            After these values are computed, the texture lookup proceeds as in <a class="citerefentry" href="textureGradOffset.xhtml"><span class="citerefentry"><span class="refentrytitle">textureGradOffset</span></span></a>,
            passing <em class="parameter"><code>dPdx</code></em> and <em class="parameter"><code>dPdy</code></em> as gradients, and <em class="parameter"><code>offset</code></em> as the offset.
        </p>
      </div>
