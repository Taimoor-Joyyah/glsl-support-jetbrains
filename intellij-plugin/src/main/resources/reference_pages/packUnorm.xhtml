        <p>packUnorm — pack floating-point values into an unsigned integer</p>
      </div>

      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">packUnorm2x16</code>, <code class="function">packSnorm2x16</code>, <code class="function">packUnorm4x8</code> and <code class="function">packSnorm4x8</code> convert
            each component of the normalized floating-point value <em class="parameter"><code>v</code></em> into 8- or 16-bit integer
            values and then packs the results into a 32-bit unsigned integer.
        </p>
        <p>
            The conversion for component <em class="parameter"><code>c</code></em> of <em class="parameter"><code>v</code></em> to fixed-point is
            performed as follows:
            </p>
        <div class="itemizedlist">
          <ul class="itemizedlist" style="list-style-type: disc; ">
            <li class="listitem">
              <p><code class="function">packUnorm2x16</code>: <code class="code"><code class="function">round</code>(<code class="function">clamp</code>(<em class="parameter"><code>c</code></em>, 0.0, 1.0) * 65535.0)</code></p>
            </li>
            <li class="listitem">
              <p><code class="function">packSnorm2x16</code>: <code class="code"><code class="function">round</code>(<code class="function">clamp</code>(<em class="parameter"><code>c</code></em>, -1.0, 1.0) * 32767.0)</code></p>
            </li>
            <li class="listitem">
              <p><code class="function">packUnorm4x8</code>: <code class="code"><code class="function">round</code>(<code class="function">clamp</code>(<em class="parameter"><code>c</code></em>, 0.0, 1.0) * 255.0)</code></p>
            </li>
            <li class="listitem">
              <p><code class="function">packSnorm4x8</code>: <code class="code"><code class="function">round</code>(<code class="function">clamp</code>(<em class="parameter"><code>c</code></em>, -1.0, 1.0) * 127.0)</code></p>
            </li>
          </ul>
        </div>
        <p>
        </p>
        <p>
            The first component of the vector will be written to the least significant bits of the output;
            the last component will be written to the most significant bits.
        </p>
      </div>
