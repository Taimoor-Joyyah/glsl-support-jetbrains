        <h2>Name</h2>
        <p>bitfieldReverse — reverse the order of bits in an integer</p>
      </div>

          <dl class="variablelist">

              <span class="term">

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">bitfieldReverse</code> returns the reversal of the bits of value. The bit
            numbered <span class="emphasis"><em>n</em></span> will be taken from bit (<span class="emphasis"><em>bits</em></span> - 1) - <span class="emphasis"><em>n</em></span>
            of <em class="parameter"><code>value</code></em>, where <span class="emphasis"><em>bits</em></span> is the total number of bits used to represent
            <em class="parameter"><code>value</code></em>.
        </p>
      </div>
