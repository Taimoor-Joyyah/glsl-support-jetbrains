      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">inverse</code> returns the inverse of the matrix <em class="parameter"><code>m</code></em>. The values in the
            returned matrix are undefined if <em class="parameter"><code>m</code></em> is singular or poorly-conditioned (nearly singular).
        </p>
