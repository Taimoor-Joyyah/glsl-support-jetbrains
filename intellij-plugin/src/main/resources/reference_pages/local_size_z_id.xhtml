<body><h1>local_size_z_id</h1>
<p>GLSL 4.60 OpenGL SPIR-V</p>
<pre>local_size_z_id</pre>
<p>Assigns a specialization ID to the z component of gl_WorkGroupSize in a compute shader.</p>
<pre>layout(local_size_z = 8, local_size_z_id = 4) in;</pre>
