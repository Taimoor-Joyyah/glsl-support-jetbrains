<body><h1>GL_SPIR_V_BINARY</h1>
<p>OpenGL 4.6 token</p>
<pre>GL_SPIR_V_BINARY</pre>
<p>Shader-object query that identifies a shader whose source is a SPIR-V binary.</p>
<pre>GLint binary;
glGetShaderiv(shader, GL_SPIR_V_BINARY, &amp;binary);</pre>
<p><a href="glSpecializeShader.xhtml">glSpecializeShader</a></p>
