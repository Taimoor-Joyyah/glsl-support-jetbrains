      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sampler</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the sampler to which the texture from which texels will be retrieved is bound.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the texture coordinates at which texture will be sampled.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>comp</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the component of the source texture that will be used to generate the resulting vector.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>refZ</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the reference Z value used in the comparison for shadow forms.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>offset</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the offset from the specified texture coordinate <em class="parameter"><code>P</code></em> from which the texels will be gathered.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">textureGatherOffset</code> returns the value:
        </p>
        <p>
</p>
        <pre class="programlisting">    vec4(Sample_i0_j1(P + offset, base).comp,
         Sample_i1_j1(P + offset, base).comp,
         Sample_i1_j0(P + offset, base).comp,
         Sample_i0_j0(P + offset, base).comp);</pre>
        <p>
    </p>
        <p>
        It perfoms as <a class="citerefentry" href="textureGather.xhtml"><span class="citerefentry"><span class="refentrytitle">textureGather</span></span></a> but with <em class="parameter"><code>offset</code></em>
        applied as described in <a class="citerefentry" href="textureOffset.xhtml"><span class="citerefentry"><span class="refentrytitle">textureOffset</span></span></a>, except that the
        implementation-dependent minimum and maximum offset values are given by <code class="constant">GL_MIN_PROGRRAM_TEXTURE_GATHER_OFFSET</code>
        and <code class="constant">GL_MAX_PROGRAM_TEXTURE_GATHER_OFFSET</code>, respectively.
    </p>
        <p>
        If specified, the value of <em class="parameter"><code>comp</code></em> must be a constant integer expression with a value
        of 0, 1, 2, or 3, identifying the x, y, z or w component of the four-component vector lookup result for each
        texel, respectively. If <em class="parameter"><code>comp</code></em> is not specified, it is treated as 0, selecting the x
        component of each texel to generate the result.
    </p>
      </div>
