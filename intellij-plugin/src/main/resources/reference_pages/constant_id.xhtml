<body><h1>constant_id</h1>
<p>GLSL 4.60 OpenGL SPIR-V</p>
<pre>constant_id</pre>
<p>Assigns a SPIR-V specialization ID to a scalar constant. The initializer supplies the default value.</p>
<pre>layout(constant_id = 4) const uint sampleCount = 1u;</pre>
<p><a href="glSpecializeShader.xhtml">glSpecializeShader</a></p>
<p>GLSL Support supplement based on the <a href="specs/GLSLangSpec.4.60.pdf">Khronos GLSL 4.60 specification</a></p>
