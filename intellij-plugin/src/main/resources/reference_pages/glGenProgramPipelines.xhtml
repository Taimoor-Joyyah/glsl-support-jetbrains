    <header/>
    <div class="refentry" id="glGenProgramPipelines">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glGenProgramPipelines — reserve program pipeline object names</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glGenProgramPipelines</strong>(</code>
              </td>
              <td>GLsizei <var class="pdparam">n</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint *<var class="pdparam">pipelines</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>n</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the number of program pipeline object names to reserve.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>pipelines</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies an array of into which the reserved names will be written.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glGenProgramPipelines</code> returns <em class="parameter"><code>n</code></em> previously unused
            program pipeline object names in <em class="parameter"><code>pipelines</code></em>. These names are marked as used,
            for the purposes of <code class="function">glGenProgramPipelines</code> only, but they
            acquire program pipeline state only when they are first bound.
        </p>
      </div>
