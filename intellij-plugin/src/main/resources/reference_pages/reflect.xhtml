        <h2>Name</h2>
        <p>reflect — calculate the reflection direction for an incident vector</p>
      </div>

      <div class="refsect1" id="parameters">

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            For a given incident vector <em class="parameter"><code>I</code></em> and surface normal <em class="parameter"><code>N</code></em> <code class="function">reflect</code> returns
            the reflection direction calculated as <code class="code"><em class="parameter"><code>I</code></em> - 2.0 * <code class="function">dot</code>(<em class="parameter"><code>N</code></em>, <em class="parameter"><code>I</code></em>) * <em class="parameter"><code>N</code></em></code>.
        </p>
        <p>
            <em class="parameter"><code>N</code></em> should be normalized in order to achieve the desired result.
        </p>
      </div>
