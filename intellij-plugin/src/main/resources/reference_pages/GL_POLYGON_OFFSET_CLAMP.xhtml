<body><h1>GL_POLYGON_OFFSET_CLAMP</h1>
<p>OpenGL 4.6 token</p>
<pre>GL_POLYGON_OFFSET_CLAMP</pre>
<p>Read the clamp set by glPolygonOffsetClamp. Its initial value is zero.</p>
<pre>GLfloat limit;
glGetFloatv(GL_POLYGON_OFFSET_CLAMP, &amp;limit);</pre>
<p><a href="glPolygonOffsetClamp.xhtml">glPolygonOffsetClamp</a></p>
