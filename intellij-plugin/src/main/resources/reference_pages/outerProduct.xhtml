        <h2>Parameters</h2>

            <dt>

          </dl>

      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">outerProduct</code> treats the first parameter <em class="parameter"><code>c</code></em> as a column
            vector (matrix with one column) and the second parameter <em class="parameter"><code>r</code></em> as a row vector
            (matrix with one row) and does a linear algebraic matrix multiply <em class="parameter"><code>c</code></em> * <em class="parameter"><code>r</code></em>,
            yielding a matrix whose number of rows is the number of components in <em class="parameter"><code>c</code></em> and
            whose number of columns is the number of components in <em class="parameter"><code>r</code></em>.
        </p>
      </div>
