    <header/>
    <div class="refentry" id="EndStreamPrimitive">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>EndStreamPrimitive — complete the current output primitive on a specified stream</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">EndStreamPrimitive</strong>(</code>
              </td>
              <td>int <var class="pdparam">stream</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>stream</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the stream upon which the current primitive will be ended.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <span class="emphasis"><em>Available only in the Geometry Shader</em></span>, <code class="function">EndStreamPrimitive</code> completes the
            current output primitive on stream <em class="parameter"><code>stream</code></em> and starts a new one. The argument to <em class="parameter"><code>stream</code></em>
            must be a constant integral expression. No vertex is emitted.
        </p>
      </div>
