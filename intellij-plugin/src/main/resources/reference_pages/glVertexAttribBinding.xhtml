    <div class="refentry" id="glVertexAttribBinding">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glVertexAttribBinding — associate a vertex attribute and a vertex buffer binding for a vertex array object</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glVertexAttribBinding</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">attribindex</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">bindingindex</var><code>)</code>;</td>
            </tr>
          </table>

          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>

              </td>
              <td>GLuint <var class="pdparam">vaobj</var>, </td>

            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">attribindex</var>, </td>

            <tr>

              <td>GLuint <var class="pdparam">bindingindex</var><code>)</code>;</td>

      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>vaobj</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the name of the vertex array object for
                    <code class="function">glVertexArrayAttribBinding</code>.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>attribindex</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    The index of the attribute to associate with a vertex
                    buffer binding.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>bindingindex</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    The index of the vertex buffer binding with which to
                    associate the generic vertex attribute.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glVertexAttribBinding</code> and
            <code class="function">glVertexArrayAttribBinding</code> establishes an
            association between the generic vertex attribute of a vertex
            array object whose index is given by
            <em class="parameter"><code>attribindex</code></em>, and a vertex buffer binding
            whose index is given by <em class="parameter"><code>bindingindex</code></em>. For
            <code class="function">glVertexAttribBinding</code>, the vertex array
            object affected is that currently bound. For
            <code class="function">glVertexArrayAttribBinding</code>,
            <em class="parameter"><code>vaobj</code></em> is the name of the vertex array
            object.
        </p>
        <p>
            <em class="parameter"><code>attribindex</code></em> must be less than the value
            of <code class="constant">GL_MAX_VERTEX_ATTRIBS</code> and
            <em class="parameter"><code>bindingindex</code></em> must be less than the value
            of <code class="constant">GL_MAX_VERTEX_ATTRIB_BINDINGS</code>.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated by
            <code class="function">glVertexAttribBinding</code> if no vertex array
            object is bound.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated by
            <code class="function">glVertexArrayAttribBinding</code> if
            <em class="parameter"><code>vaobj</code></em> is not the name of an existing
            vertex array object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if <em class="parameter"><code>attribindex</code></em> is greater than
            or equal to the value of <code class="constant">GL_MAX_VERTEX_ATTRIBS</code>.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if <em class="parameter"><code>bindingindex</code></em> is greater than
            or equal to the value of <code class="constant">GL_MAX_VERTEX_ATTRIB_BINDINGS</code>.
        </p>
      </div>
      <div class="refsect1" id="associatedgets">
        <h2>Associated Gets</h2>
        <p>
            <a class="citerefentry" href="glGet.xhtml"><span class="citerefentry"><span class="refentrytitle">glGet</span></span></a>
            with arguments
            <code class="constant">GL_MAX_VERTEX_ATTRIB_BINDINGS</code>,
            <code class="constant">GL_VERTEX_BINDING_DIVISOR</code>.
        </p>
      </div>
