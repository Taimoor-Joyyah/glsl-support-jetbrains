      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>image</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the image unit into which to store a texel.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the coordinate at which to store the texel.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sample</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    When present, specifies the sample within the image to store into.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>data</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the data to store into the image.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">imageStore</code> stores <em class="parameter"><code>data</code></em> into the texel at the coordinate <em class="parameter"><code>P</code></em> from
            the image specified by <em class="parameter"><code>image</code></em>.  For multi-sample stores, the sample number is given by <em class="parameter"><code>sample</code></em>.  When
            <em class="parameter"><code>image</code></em>, <em class="parameter"><code>P</code></em>, and <em class="parameter"><code>sample</code></em> identify a valid texel, the bits
            used to represent data are converted to the format of the image unit in the manner described in of the OpenGL Specification and stored to
            the specified texel.
        </p>
      </div>
