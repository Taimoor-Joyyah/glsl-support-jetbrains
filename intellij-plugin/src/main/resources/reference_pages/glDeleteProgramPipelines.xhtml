    <header/>
    <div class="refentry" id="glDeleteProgramPipelines">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glDeleteProgramPipelines — delete program pipeline objects</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glDeleteProgramPipelines</strong>(</code>
              </td>
              <td>GLsizei <var class="pdparam">n</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>const GLuint *<var class="pdparam">pipelines</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>n</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the number of program pipeline objects to delete.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>pipelines</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies an array of names of program pipeline objects to delete.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glDeleteProgramPipelines</code> deletes the <em class="parameter"><code>n</code></em> program pipeline objects
            whose names are stored in the array <em class="parameter"><code>pipelines</code></em>. Unused names in <em class="parameter"><code>pipelines</code></em> are
            ignored, as is the name zero. After a program pipeline object is deleted, its name is again unused and it
            has no contents. If program pipeline object that is currently bound is deleted, the binding for that object reverts to
            zero and no program pipeline object becomes current.
        </p>
      </div>
