    <header/>
    <div class="refentry" id="glShaderStorageBlockBinding">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glShaderStorageBlockBinding — change an active shader storage block binding</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glShaderStorageBlockBinding</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">program</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">storageBlockIndex</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">storageBlockBinding</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>program</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    The name of the program containing the block whose binding to change.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>storageBlockIndex</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    The index storage block within the program.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>storageBlockBinding</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    The index storage block binding to associate with the specified storage block.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glShaderStorageBlockBinding</code>, changes the active
            shader storage block with an assigned index of <em class="parameter"><code>storageBlockIndex</code></em>
            in program object <em class="parameter"><code>program</code></em>.  <em class="parameter"><code>storageBlockIndex</code></em> must be an active shader storage block
            index in <em class="parameter"><code>program</code></em>. <em class="parameter"><code>storageBlockBinding</code></em> must be less than the value of <code class="constant">GL_MAX_SHADER_STORAGE_BUFFER_BINDINGS</code>.
            If successful, <code class="function">glShaderStorageBlockBinding</code> specifies that <em class="parameter"><code>program</code></em> will use the data store of
            the buffer object bound to the binding point <em class="parameter"><code>storageBlockBinding</code></em> to read
            and write the values of the buffer variables in the shader storage block identified by <em class="parameter"><code>storageBlockIndex</code></em>.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if <em class="parameter"><code>program</code></em> is not the name of either a program or shader object.
        </p>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if <em class="parameter"><code>program</code></em> is the name of a shader object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if <em class="parameter"><code>storageBlockIndex</code></em> is not an active shader storage block index in <em class="parameter"><code>program</code></em>, or if <em class="parameter"><code>storageBlockBinding</code></em> is greater than or equal to the value of <code class="constant">MAX_SHADER_STORAGE_BUFFER_BINDINGS</code>.
        </p>
      </div>
      <div class="refsect1" id="associatedgets">
        <h2>Associated Gets</h2>
        <p>
            <a class="citerefentry" href="glGet.xhtml"><span class="citerefentry"><span class="refentrytitle">glGet</span></span></a> with arguments <code class="constant">GL_SHADER_STORAGE_BUFFER_BINDING</code>,
            <code class="constant">GL_MAX_SHADER_STORAGE_BUFFER_BINDINGS</code>, <code class="constant">GL_MAX_VERTEX_SHADER_STORAGE_BLOCKS</code>,
            <code class="constant">GL_MAX_TESS_CONTROL_SHADER_STORAGE_BLOCKS</code>, <code class="constant">GL_MAX_TESS_EVALUATION_SHADER_STORAGE_BLOCKS</code>,
            <code class="constant">GL_MAX_GEOMETRY_SHADER_STORAGE_BLOCKS</code>, <code class="constant">GL_MAX_FRAGMENT_SHADER_STORAGE_BLOCKS</code>,
            <code class="constant">GL_MAX_COMPUTE_SHADER_STORAGE_BLOCKS</code> or <code class="constant">GL_MAX_COMBINED_SHADER_STORAGE_BLOCKS</code>,
            <code class="constant">GL_MAX_SHADER_STORAGE_BUFFER_BINDINGS</code>, or <code class="constant">GL_MAX_COMBINED_SHADER_OUTPUT_RESOURCES</code>.
        </p>
      </div>
