      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>image</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the image unit into which to store <em class="parameter"><code>data</code></em>.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>P</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specify the coordinate at which to store the data.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>sample</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    When present, specifies the sample within the image to store into.
                </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>data</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                    Specifies the data of which to take the maximum with that stored in the image.
                </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">imageAtomicMax</code> atomically computes a new value by finding the maximum of the value of <em class="parameter"><code>data</code></em>
            and the contents of the texel at coordinate <em class="parameter"><code>P</code></em> and <em class="parameter"><code>sample</code></em> in the
            image bound to uint <em class="parameter"><code>image</code></em>, stores that value into the image and returns the original value.
        </p>
      </div>
