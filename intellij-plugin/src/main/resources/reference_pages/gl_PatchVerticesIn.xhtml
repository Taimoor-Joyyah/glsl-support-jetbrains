    <div class="refentry" id="gl_PatchVerticesIn">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_PatchVerticesIn — contains the number of vertices in the current patch</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">int </span><span class="varname">gl_PatchVerticesIn </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            Available only in the tessellation control and evaluation languages, <code class="varname">gl_PatchVerticesIn</code>
            contains the number of vertices in the input being processed by the shader. A single tessellation control or
            evaluation shader can read patches of differing sizes, and so th value of <code class="varname">gl_PatchVertexIn</code>
            may differ between patches.
        </p>
      </div>
