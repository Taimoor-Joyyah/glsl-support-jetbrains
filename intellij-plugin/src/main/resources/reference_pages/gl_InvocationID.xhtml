    <div class="refentry" id="gl_InvocationID">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_InvocationID — contains the invocation index of the current shader</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">int </span><span class="varname">gl_InvocationID </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            In the tessellation control language, <code class="varname">gl_InvocationID</code>
            contains the index of the output patch vertex assigned to the shader invocation.
            It is assigned an integer value in the range [0, N-1] where N is the number of output
            patch vertices.
        </p>
        <p>
            In the geometry language, <code class="varname">gl_InvocationID</code> identifies
            the invocation number assigned to the geometry shader invocation. It is assigned
            an integer value in the range [0, N-1] where N is the number of geometry shader
            invocations per primitive.
        </p>
      </div>
