    <header/>
    <div class="refentry" id="gl_VertexID">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>gl_VertexID — contains the index of the current vertex</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>Declaration</h2>
        <code class="fieldsynopsis"><span class="modifier">in </span><span class="type">int </span><span class="varname">gl_VertexID </span>;</code>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="varname">gl_VertexID</code> is a vertex language input variable that holds an
            integer index for the vertex. The index is implicitly generated by <code class="varname">glDrawArrays</code>
            and other commands that do not reference the content of the <code class="constant">GL_ELEMENT_ARRAY_BUFFER</code>, or
            explicitly generated from the content of the <code class="constant">GL_ELEMENT_ARRAY_BUFFER</code>
            by commands such as <code class="function">glDrawElements</code>. For <code class="function">glDrawElements</code> forms that take a <em class="parameter"><code>basevertex</code></em>, <code class="varname">gl_VertexID</code> will have this value added to the index from the buffer.
        </p>
      </div>
