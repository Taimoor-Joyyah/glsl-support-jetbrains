    <header/>
    <div class="refentry" id="glTransformFeedbackBufferBase">
      <div class="titlepage"/>
      <div class="refnamediv">
        <h2>Name</h2>
        <p>glTransformFeedbackBufferBase — bind a buffer object to a transform feedback buffer object</p>
      </div>
      <div class="refsynopsisdiv">
        <h2>C Specification</h2>
        <div class="funcsynopsis">
          <table style="border: 0; cellspacing: 0; cellpadding: 0;" class="funcprototype-table">
            <tr>
              <td>
                <code class="funcdef">void <strong class="fsfunc">glTransformFeedbackBufferBase</strong>(</code>
              </td>
              <td>GLuint <var class="pdparam">xfb</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">index</var>, </td>
            </tr>
            <tr>
              <td> </td>
              <td>GLuint <var class="pdparam">buffer</var><code>)</code>;</td>
            </tr>
          </table>
          <div class="funcprototype-spacer"> </div>
        </div>
      </div>
      <div class="refsect1" id="parameters">
        <h2>Parameters</h2>
        <div class="variablelist">
          <dl class="variablelist">
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>xfb</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Name of the transform feedback buffer object.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>index</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Index of the binding point within
                        <em class="parameter"><code>xfb</code></em>.
                    </p>
            </dd>
            <dt>
              <span class="term">
                <em class="parameter">
                  <code>buffer</code>
                </em>
              </span>
            </dt>
            <dd>
              <p>
                        Name of the buffer object to bind to the specified
                        binding point.
                    </p>
            </dd>
          </dl>
        </div>
      </div>
      <div class="refsect1" id="description">
        <h2>Description</h2>
        <p>
            <code class="function">glTransformFeedbackBufferBase</code> binds the
            buffer object <em class="parameter"><code>buffer</code></em> to the binding point
            at index <em class="parameter"><code>index</code></em> of the transform feedback
            object <em class="parameter"><code>xfb</code></em>.
        </p>
      </div>
      <div class="refsect1" id="notes">
        <h2>Notes</h2>
        <p>
            Calling <code class="function">glTransformFeedbackBufferBase</code> is
            equivalent to calling
            <a class="citerefentry" href="glTransformFeedbackBufferRange.xhtml"><span class="citerefentry"><span class="refentrytitle">glTransformFeedbackBufferRange</span></span></a>
            with <em class="parameter"><code>offset</code></em> zero and
            <em class="parameter"><code>size</code></em> equal to the size of
            <em class="parameter"><code>buffer</code></em>.
        </p>
      </div>
      <div class="refsect1" id="errors">
        <h2>Errors</h2>
        <p>
            <code class="constant">GL_INVALID_OPERATION</code> is generated if
            <em class="parameter"><code>xfb</code></em> is not the name of an existing
            transform feedback object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if in
            <em class="parameter"><code>buffer</code></em> is not zero or the name of an
            existing buffer object.
        </p>
        <p>
            <code class="constant">GL_INVALID_VALUE</code> is generated if
            <em class="parameter"><code>index</code></em> is greater than or equal to the
            number of transform feedback buffer binding points (the value of
            <code class="constant">GL_TRANSFORM_FEEDBACK_BUFFER_BINDING</code>).
        </p>
      </div>
      
      <div class="refsect1" id="seealso">
        <h2>See Also</h2>
        <p>
            <a class="citerefentry" href="glBindBufferRange.xhtml"><span class="citerefentry"><span class="refentrytitle">glBindBufferRange</span></span></a>,
            <a class="citerefentry" href="glBindBufferBase.xhtml"><span class="citerefentry"><span class="refentrytitle">glBindBufferBase</span></span></a>,
            <a class="citerefentry" href="glTransformFeedbackBufferRange.xhtml"><span class="citerefentry"><span class="refentrytitle">glTransformFeedbackBufferRange</span></span></a>.
        </p>
      </div>
